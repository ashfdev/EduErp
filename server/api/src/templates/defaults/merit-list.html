<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Noto Sans Bengali', Arial, sans-serif; box-sizing: border-box; }
  body { margin: 0; padding: 12mm; font-size: 12px; }
  .header { text-align: center; border-bottom: 2px solid {{institution.primary_color}}; padding-bottom: 6px; margin-bottom: 10px; }
  .header h1 { margin: 0; font-size: 16px; color: {{institution.primary_color}}; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #999; padding: 5px; text-align: center; }
  th { background: {{institution.primary_color}}; color: #fff; }
  tr:nth-child(even) { background: #f7f7f7; }
</style>
</head>
<body>
  <div class="header">
    <h1>{{institution.name_en}}</h1>
    <p>Merit List — {{exam_name}} — {{class_name}} — {{academic_year_label}}</p>
  </div>
  <table>
    <thead><tr><th>Rank</th><th>Roll No</th><th>Student ID</th><th>Name</th><th>Total GPA</th></tr></thead>
    <tbody>
      {{#each rows}}
      <tr><td>{{this.rank}}</td><td>{{this.roll_no}}</td><td>{{this.student_uid}}</td><td>{{this.name_en}}</td><td>{{this.total_gpa}}</td></tr>
      {{/each}}
    </tbody>
  </table>
</body>
</html>
