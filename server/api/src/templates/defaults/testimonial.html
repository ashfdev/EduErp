<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Noto Sans Bengali', Arial, sans-serif; box-sizing: border-box; }
  body { margin: 0; padding: 18mm; font-size: 13px; line-height: 1.8; }
  .letterhead { text-align: center; border-bottom: 3px double {{institution.primary_color}}; padding-bottom: 10px; margin-bottom: 24px; }
  .letterhead img { height: 20mm; }
  .letterhead-text h1 { margin: 4px 0; color: {{institution.primary_color}}; }
  .letterhead-text p { margin: 2px 0; font-size: 11px; }
  .title { text-align: center; font-size: 16px; font-weight: 700; text-decoration: underline; margin-bottom: 20px; }
  .body-text { text-align: justify; }
  .footer { display: flex; justify-content: space-between; margin-top: 50px; }
  .signature-block { text-align: center; width: 30%; }
  .sig-line { border-top: 1px solid #333; margin-top: 24px; }
  .sig-name { font-size: 10px; font-weight: 600; margin: 2px 0 0; }
  .sig-designation { font-size: 9px; color: #555; }
</style>
</head>
<body>
  {{watermark}}
  <div class="letterhead">
    {{> letterhead}}
  </div>
  <p class="title">TESTIMONIAL</p>
  <div class="body-text">{{{body_html}}}</div>
  <div class="footer">
    <div>Date: {{banglaDate issue_date}}<br />Institution Seal</div>
    {{signatureBlock 1}}
  </div>
</body>
</html>
