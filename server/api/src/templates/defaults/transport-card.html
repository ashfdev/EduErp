<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Noto Sans Bengali', Arial, sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 85.6mm; height: 54mm; }
  .card { width: 85.6mm; height: 54mm; border: 1px solid #ccc; overflow: hidden; position: relative; }
  .band { background: {{institution.primary_color}}; color: #fff; padding: 3mm 3mm 1mm; display: flex; align-items: center; gap: 2mm; }
  .band img { height: 6mm; }
  .band .name { font-size: 8px; font-weight: 600; }
  .body { display: flex; gap: 2mm; padding: 2mm 3mm; }
  .photo { width: 18mm; height: 22mm; border: 1px solid {{institution.primary_color}}; border-radius: 2px; object-fit: cover; background: #eee; }
  .info { font-size: 8px; line-height: 1.5; }
  .info .student-name { font-weight: 700; font-size: 10px; }
  .title { position: absolute; top: 3mm; right: 3mm; font-size: 7px; font-weight: 700; color: #fff; }
  .strip { height: 2mm; background: {{institution.secondary_color}}; position: absolute; bottom: 0; width: 100%; }
</style>
</head>
<body>
  <div class="card">
    <div class="band">
      {{institutionLogo}}
      <span class="name">{{institution.name_en}}</span>
      <span class="title">TRANSPORT</span>
    </div>
    <div class="body">
      <img class="photo" src="{{student.photo_url}}" />
      <div class="info">
        <p class="student-name">{{student.name_en}}</p>
        <p class="badge">{{student.student_uid}}</p>
        <p>Route: {{transport.route.name}}</p>
        <p>Vehicle: {{transport.vehicle_no}}</p>
      </div>
    </div>
    <div class="strip"></div>
  </div>
</body>
</html>
