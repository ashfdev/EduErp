services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: education_erp
    # No host port published — security incident (2026-09-23): this was
    # previously "5433:5432", exposing Postgres to the entire internet on
    # 0.0.0.0. Combined with the default postgres/postgres credential, this
    # was actively brute-forced (~19.5k failed logins/24h) and successfully
    # compromised — an attacker installed a persistent backdoor (event
    # triggers `log_start`/`log_end` calling a function `escalate_priv()`
    # that recreated a superuser role on every DDL command, plus a second
    # `wog` superuser role and the `postgres_fdw` extension). All of it was
    # removed and the password rotated, but never publish this port again —
    # every other service reaches Postgres over the internal Docker network
    # via postgres:5432, no service needs host access.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G

  redis:
    image: redis:7-alpine
    restart: always
    # Not published to the host: every service reaches it over the internal
    # docker network via redis://redis:6379 (no service needs host access,
    # and this image has no password set, so a host port would be exposed
    # unauthenticated).
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  api:
    build:
      context: .
      dockerfile: server/api/Dockerfile
    restart: always
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eduerp-api.rule=Host(`erpapi.ashdevs.com`)"
      - "traefik.http.routers.eduerp-api.entrypoints=websecure"
      - "traefik.http.routers.eduerp-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.eduerp-api.loadbalancer.server.port=4000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/education_erp?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
      NODE_ENV: production
      DEVICE_SERVICE_URL: http://device-service:4500
      # CORS allowlist — must match the public domains of every frontend
      ADMIN_URL: ${ADMIN_URL}
      PORTAL_URL: ${PORTAL_URL}
      WEBSITE_URL: ${WEBSITE_URL}
      TEACHER_URL: ${TEACHER_URL}
      API_URL: ${API_URL}
      # JWT secrets — required for auth token signing
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # At-rest encryption key for sensitive settings (payment creds etc.)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # HMAC secret for signed local-file download URLs
      LOCAL_STORAGE_SECRET: ${LOCAL_STORAGE_SECRET}
      # Shared secret for device-service ↔ api calls
      DEVICE_SERVICE_SECRET: ${DEVICE_SERVICE_SECRET}
      # Revalidate secret for Next.js ISR
      WEBSITE_REVALIDATE_SECRET: ${WEBSITE_REVALIDATE_SECRET:-changeme}
    volumes:
      # storage.service.ts resolves the local-upload fallback to
      # $(pwd)/local-uploads, which is /app/local-uploads at container
      # runtime (see server/api/Dockerfile CMD). Without this volume every
      # uploaded file (student photos, documents, signatures) is lost on
      # each redeploy. Prefer Azure Blob in production; this is the safety
      # net for whenever AZURE_STORAGE_CONNECTION_STRING is unset.
      - api_local_uploads:/app/local-uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eduerp-admin.rule=Host(`erp.ashdevs.com`)"
      - "traefik.http.routers.eduerp-admin.entrypoints=websecure"
      - "traefik.http.routers.eduerp-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.eduerp-admin.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eduerp-portal.rule=Host(`student.ashdevs.com`)"
      - "traefik.http.routers.eduerp-portal.entrypoints=websecure"
      - "traefik.http.routers.eduerp-portal.tls.certresolver=letsencrypt"
      - "traefik.http.services.eduerp-portal.loadbalancer.server.port=3001"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      PORT: 3001
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api

  website:
    build:
      context: .
      dockerfile: apps/website/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eduerp-website.rule=Host(`alhumaira.ashdevs.com`)"
      - "traefik.http.routers.eduerp-website.entrypoints=websecure"
      - "traefik.http.routers.eduerp-website.tls.certresolver=letsencrypt"
      - "traefik.http.services.eduerp-website.loadbalancer.server.port=3002"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      PORT: 3002
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api

  teacher:
    build:
      context: .
      dockerfile: apps/teacher/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eduerp-teacher.rule=Host(`teacher.ashdevs.com`)"
      - "traefik.http.routers.eduerp-teacher.entrypoints=websecure"
      - "traefik.http.routers.eduerp-teacher.tls.certresolver=letsencrypt"
      - "traefik.http.services.eduerp-teacher.loadbalancer.server.port=3003"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      PORT: 3003
      HOSTNAME: "0.0.0.0"
    depends_on:
      - api

  device-service:
    build:
      context: .
      dockerfile: services/device/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/education_erp?schema=public
      API_URL: http://api:4000
      DEVICE_SERVICE_PORT: 4500
      DEVICE_SERVICE_SECRET: ${DEVICE_SERVICE_SECRET}
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 384M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4500/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/education_erp?schema=public
      REDIS_URL: redis://redis:6379
      NOTIFICATION_SERVICE_PORT: 4600
      # Decrypts Settings -> SMS Gateway's DB-stored credential (AES-256,
      # same scheme as PaymentGatewayConfig) before each send — was missing
      # here (only the api service had it), so every SMS job failed at
      # sms.worker.js's resolveActiveSmsGateway() with "ENCRYPTION_KEY must
      # be set in production" even though the gateway was correctly
      # configured in Settings.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 384M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4600/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  api_local_uploads:

networks:
  dokploy-network:
    external: true
