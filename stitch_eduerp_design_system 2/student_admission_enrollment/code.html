<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduErp - Student Admission</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {

                        "secondary": "#545c83",

                        "surface-container-low": "#eff4ff",
                        "surface-card": "#FFFFFF",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "on-tertiary-container": "#e9e6ff",

                        "on-secondary-fixed-variant": "#3d456a",
                        "on-error": "#ffffff",
                        "inverse-surface": "#213145",
                        "surface-dim": "#cbdbf5",
                        "inverse-on-surface": "#eaf1ff",
                        "on-primary-fixed-variant": "#004398",
                        "on-primary": "#ffffff",
                        "surface-container": "#e5eeff",
                        "primary": "#004cab",
                        "outline-variant": "#c2c6d6",
                        "error": "#ba1a1a",
                        "status-success": "#10B981",
                        "on-primary-container": "#e2e8ff",
                        "surface": "#f8f9ff",
                        "success-container": "#D1FAE5",
                        "surface-variant": "#d3e4fe",
                        "on-tertiary-fixed-variant": "#2f2ebe",
                        "inverse-primary": "#afc6ff",
                        "tertiary-fixed": "#e1e0ff",
                        "outline": "#727785",
                        "border-subtle": "#E2E8F0",
                        "secondary-fixed-dim": "#bcc4f1",
                        "on-background": "#0b1c30",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#dde1ff",
                        "primary-container": "#0963d8",
                        "status-error": "#EF4444",
                        "on-surface": "#0b1c30",
                        "status-warning": "#F59E0B",
                        "on-tertiary-fixed": "#07006c",
                        "primary-fixed": "#d9e2ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-desktop": "24px",
                        "topbar-height": "64px",
                        "margin-mobile": "16px",
                        "unit": "4px",
                        "sidebar-width": "256px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-base": ["Inter"],
                        "display-lg": ["Inter"],

                    "fontSize": {

                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-medium": ["14px", { "lineHeight": "20px", "letterSpacing": "0", "fontWeight": "500" }],
                        "helper-text": ["12px", { "lineHeight": "16px", "letterSpacing": "0", "fontWeight": "400" }],

                },
            },

<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface-canvas text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar (Transactional - simplified) -->
<header class="bg-surface-card h-topbar-height sticky top-0 w-full border-b border-border-subtle shadow-sm z-50">
<div class="flex justify-between items-center px-6 w-full max-w-7xl mx-auto h-full">
<div class="flex items-center gap-3">
<img alt="EduErp Logo" class="h-8 w-8 rounded-md object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9Ltfpw9VanwcH6y8ymHSNP5t67G4pbXTLW4V4JFpoljP7ljXLt_FbGQHILwkbzUIeum8JhU-MOFPYk4_9cbcxuEbrOVpR6zKNSe3ZPPI1utzf1x4cxU5u_f5BDKfitodwI1ysmYGU_L3qy0C2Sxaq0WYbLFn0BuWn3le95rxlpGC-V2Uyx-O1KQ95YeEmyXNenNeip98iANbGOR7LLzKwGO7094K-zd3KnVLEpE9rjxQl4pz8xQ3E"/>
<span class="font-headline-md text-headline-md font-black text-on-surface">EduErp</span>
</div>
<div class="flex items-center gap-4">
<span class="font-body-medium text-body-medium text-on-surface-variant">Admission Portal</span>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center py-margin-desktop px-margin-mobile md:px-margin-desktop w-full max-w-3xl mx-auto">
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">Student Application Form</h1>
<p class="font-body-base text-body-base text-on-surface-variant max-w-xl mx-auto">Please complete all required fields below to begin the enrollment process for the upcoming academic year.</p>
</div>
<!-- Stepper -->
<div class="w-full mb-8">
<div class="flex justify-between items-center relative before:content-[''] before:absolute before:top-1/2 before:-translate-y-1/2 before:h-0.5 before:w-full before:bg-border-subtle before:-z-10">
<!-- Step 1 (Active) -->
<div class="flex flex-col items-center bg-surface-canvas px-2 z-10">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary flex items-center justify-center font-body-medium text-body-medium mb-2 ring-4 ring-surface-canvas shadow-sm">1</div>
<span class="font-label-caps text-label-caps text-primary font-bold">Personal Info</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center bg-surface-canvas px-2 z-10">
<div class="w-8 h-8 rounded-full bg-surface-card border-2 border-border-subtle text-on-surface-variant flex items-center justify-center font-body-medium text-body-medium mb-2 ring-4 ring-surface-canvas">2</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Academics</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center bg-surface-canvas px-2 z-10">
<div class="w-8 h-8 rounded-full bg-surface-card border-2 border-border-subtle text-on-surface-variant flex items-center justify-center font-body-medium text-body-medium mb-2 ring-4 ring-surface-canvas">3</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Documents</span>
</div>
</div>
</div>
<!-- Form Card -->
<div class="bg-surface-card w-full rounded-xl border border-border-subtle shadow-sm p-6 mb-8 relative overflow-hidden">
<!-- Form Content (Personal Info Step) -->
<form class="space-y-6">
<div class="border-b border-border-subtle pb-4 mb-4">
<h2 class="font-title-sm text-title-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">person</span>
                        Student Details
                    </h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- First Name -->
<div class="space-y-2">
<label class="font-body-medium text-body-medium text-on-surface block" for="firstName">First Name <span class="text-status-error">*</span></label>
<input class="w-full h-9 px-3 bg-surface-container-lowest border border-border-subtle rounded text-body-base focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder-on-surface-variant" id="firstName" name="firstName" placeholder="Enter first name" type="text"/>
</div>
<!-- Last Name -->
<div class="space-y-2">
<label class="font-body-medium text-body-medium text-on-surface block" for="lastName">Last Name <span class="text-status-error">*</span></label>
<input class="w-full h-9 px-3 bg-surface-container-lowest border border-border-subtle rounded text-body-base focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder-on-surface-variant" id="lastName" name="lastName" placeholder="Enter last name" type="text"/>
</div>
<!-- Date of Birth -->
<div class="space-y-2">
<label class="font-body-medium text-body-medium text-on-surface block" for="dob">Date of Birth <span class="text-status-error">*</span></label>
<input class="w-full h-9 px-3 bg-surface-container-lowest border border-border-subtle rounded text-body-base text-on-surface-variant focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all" id="dob" name="dob" type="date"/>
</div>
<!-- Gender -->
<div class="space-y-2">
<label class="font-body-medium text-body-medium text-on-surface block" for="gender">Gender <span class="text-status-error">*</span></label>
<select class="w-full h-9 px-3 bg-surface-container-lowest border border-border-subtle rounded text-body-base text-on-surface-variant focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all appearance-none" id="gender" name="gender">
<option disabled="" selected="" value="">Select gender</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
<option value="prefer-not">Prefer not to say</option>
</select>
</div>
</div>
<div class="border-b border-border-subtle pb-4 mb-4 mt-8">
<h2 class="font-title-sm text-title-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">contact_mail</span>
                        Contact Information
                    </h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Email -->
<div class="space-y-2 md:col-span-2">
<label class="font-body-medium text-body-medium text-on-surface block" for="email">Primary Email Address <span class="text-status-error">*</span></label>
<input class="w-full h-9 px-3 bg-surface-container-lowest border border-border-subtle rounded text-body-base focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder-on-surface-variant" id="email" name="email" placeholder="student@example.com" type="email"/>
</div>
<!-- Phone -->
<div class="space-y-2">
<label class="font-body-medium text-body-medium text-on-surface block" for="phone">Phone Number <span class="text-status-error">*</span></label>
<input class="w-full h-9 px-3 bg-surface-container-lowest border border-border-subtle rounded text-body-base focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder-on-surface-variant" id="phone" name="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
<!-- Alt Phone -->
<div class="space-y-2">
<label class="font-body-medium text-body-medium text-on-surface block" for="altPhone">Alternate Phone (Optional)</label>
<input class="w-full h-9 px-3 bg-surface-container-lowest border border-border-subtle rounded text-body-base focus:outline-none focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all placeholder-on-surface-variant" id="altPhone" name="altPhone" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<!-- Actions -->
<div class="flex justify-end gap-3 mt-8 pt-6 border-t border-border-subtle">
<button class="px-4 py-2 rounded-lg bg-surface-container-low text-on-surface-variant font-body-medium text-body-medium border border-border-subtle hover:bg-border-subtle transition-colors" type="button">
                        Save Draft
                    </button>
<button class="px-6 py-2 rounded-lg bg-primary-container text-on-primary font-body-medium text-body-medium hover:bg-surface-tint transition-colors shadow-sm flex items-center gap-2" type="button">
                        Next Step
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
</body></html>
